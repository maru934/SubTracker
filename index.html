<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubTracker - サブスク管理</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>

  <header>
    <div class="header-brand">🌙 SubTracker</div>
    <div class="header-stats">
      <div class="stat">
        <span class="stat-label">月額合計</span>
        <span class="stat-value" id="total-monthly">¥0</span>
      </div>
      <div class="stat">
        <span class="stat-label">年額合計</span>
        <span class="stat-value" id="total-yearly">¥0</span>
      </div>
      <div class="stat">
        <span class="stat-label">件数</span>
        <span class="stat-value" id="sub-count">0件</span>
      </div>
    </div>
    <button type="button" class="btn-add" id="btn-add-header">＋ 追加</button>
  </header>

  <div class="alert-banner" id="alert-banner" role="status" aria-live="polite"></div>

  <nav class="tabs" role="tablist" aria-label="ビュー切替">
    <button type="button" class="tab active" role="tab" id="tab-list"
            aria-selected="true" aria-controls="view-list" data-tab="list">ホーム</button>
    <button type="button" class="tab" role="tab" id="tab-calendar"
            aria-selected="false" aria-controls="view-calendar" tabindex="-1" data-tab="calendar">カレンダー</button>
    <button type="button" class="tab" role="tab" id="tab-eval"
            aria-selected="false" aria-controls="view-eval" tabindex="-1" data-tab="eval">評価</button>
  </nav>

  <main>
    <section id="view-list" class="view active" role="tabpanel" aria-labelledby="tab-list">
      <div id="cancel-candidates" class="cancel-candidates" style="display:none"></div>
      <div class="home-summary">
        <div class="summary-card">
          <div class="summary-label">今月の支払い</div>
          <div class="summary-value" id="summary-this-month">¥0</div>
          <div class="summary-sub" id="summary-this-month-count">0件</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">年間換算</div>
          <div class="summary-value" id="summary-yearly">¥0</div>
          <div class="summary-sub" id="summary-monthly-equiv">月額換算 ¥0</div>
        </div>
      </div>
      <div class="list-toolbar">
        <input type="search" id="search" placeholder="🔍 検索（名前・メモ・カテゴリ）" autocomplete="off" aria-label="検索">
        <select id="filter-category" aria-label="カテゴリで絞り込み">
          <option value="">全カテゴリ</option>
          <option>動画</option>
          <option>音楽</option>
          <option>ソフトウェア</option>
          <option>ゲーム</option>
          <option>クラウド</option>
          <option>その他</option>
        </select>
        <select id="sort-by" aria-label="並び替え">
          <option value="renewal">更新日順</option>
          <option value="amount-desc">金額が高い順</option>
          <option value="amount-asc">金額が安い順</option>
          <option value="name">名前順</option>
        </select>
      </div>
      <div id="sub-list" class="sub-list"></div>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">📋</div>
        <p id="empty-text">サブスクがまだ登録されていません</p>
        <button type="button" id="btn-add-empty">＋ 最初のサブスクを追加</button>
      </div>
    </section>

    <section id="view-calendar" class="view" role="tabpanel" aria-labelledby="tab-calendar">
      <div class="calendar-header">
        <button type="button" id="btn-prev-month" aria-label="前月">‹</button>
        <span id="calendar-title"></span>
        <button type="button" id="btn-next-month" aria-label="翌月">›</button>
      </div>
      <div class="calendar-grid" role="row">
        <div class="day-header sun" role="columnheader">日</div>
        <div class="day-header" role="columnheader">月</div>
        <div class="day-header" role="columnheader">火</div>
        <div class="day-header" role="columnheader">水</div>
        <div class="day-header" role="columnheader">木</div>
        <div class="day-header" role="columnheader">金</div>
        <div class="day-header sat" role="columnheader">土</div>
      </div>
      <div id="calendar-days" class="calendar-days"></div>
      <div id="calendar-summary" class="calendar-summary"></div>
    </section>

    <section id="view-eval" class="view" role="tabpanel" aria-labelledby="tab-eval">
      <div id="eval-pending"></div>
      <div id="category-breakdown" class="category-breakdown" style="display:none"></div>
      <div id="eval-history"></div>
    </section>
  </main>

  <footer class="app-footer">
    <button type="button" id="btn-export" class="btn-text">📤 エクスポート</button>
    <button type="button" id="btn-import" class="btn-text">📥 インポート</button>
    <button type="button" id="btn-theme" class="btn-text" aria-label="テーマ切替" title="テーマ切替">🌙</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </footer>

  <!-- Add/Edit modal -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">サブスクを追加</h2>
        <button type="button" class="modal-close" id="btn-modal-close" aria-label="閉じる">×</button>
      </div>
      <form id="sub-form" novalidate>
        <div class="form-group">
          <label for="f-name">サービス名</label>
          <input type="text" id="f-name" placeholder="Netflix" required autocomplete="off" maxlength="60">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-amount">金額（円）</label>
            <input type="number" id="f-amount" placeholder="1490" min="0" max="9999999" required inputmode="numeric">
          </div>
          <div class="form-group">
            <label for="f-cycle">課金サイクル</label>
            <select id="f-cycle">
              <option value="monthly">月額</option>
              <option value="yearly">年額</option>
              <option value="weekly">週額</option>
            </select>
          </div>
        </div>
        <div class="form-equiv" id="f-equiv" aria-live="polite"></div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-category">カテゴリ</label>
            <select id="f-category">
              <option>動画</option>
              <option>音楽</option>
              <option>ソフトウェア</option>
              <option>ゲーム</option>
              <option>クラウド</option>
              <option>その他</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-renewal">次回更新日</label>
            <input type="date" id="f-renewal" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="f-trial">無料トライアル終了日（任意）</label>
            <input type="date" id="f-trial">
          </div>
          <div class="form-group">
            <label for="f-pause">休止する（任意・この日まで停止）</label>
            <input type="date" id="f-pause">
          </div>
        </div>
        <div class="form-group">
          <label for="f-url">サービスURL（任意）</label>
          <input type="url" id="f-url" placeholder="https://..." autocomplete="off" inputmode="url">
        </div>
        <div class="form-group">
          <label for="f-memo">メモ（任意）</label>
          <input type="text" id="f-memo" placeholder="解約は◯月◯日まで..." maxlength="120">
        </div>
        <div id="price-history" class="price-history" style="display:none"></div>
        <div class="modal-actions">
          <button type="button" id="btn-cancel">キャンセル</button>
          <button type="submit" class="btn-save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal modal-confirm">
      <h2 id="confirm-title">確認</h2>
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" id="btn-confirm-cancel">キャンセル</button>
        <button type="button" id="btn-confirm-ok" class="btn-danger">OK</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-action" class="btn-text" hidden></button>
  </div>

  <script src="app.js"></script>
</body>
</html>
